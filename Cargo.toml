[package]
name = "gene-extractor"
version = "0.1.0"
edition = "2024"

[dependencies]
itertools = "0.15.0"
log = "0.4.32"
pprof = { version = "0.15.0", features = ["flamegraph"]}
tracing = "0.1.44"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[lib]
name = "gene_extractor"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[dependencies.pyo3]
version = "0.29.0"
# "abi3-py38" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.8
features = ["abi3-py38"]